<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Alina ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #ffdee9, #b5fffc);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      color: #333;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      max-width: 420px;
      width: 90%;
      animation: fadeIn 1.2s ease;
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 24px;
    }

    .question {
      font-size: 1.5rem;
      margin: 24px 0;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      height: 64px;
    }

    button {
      padding: 14px 24px;
      font-size: 1rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .yes {
      background: #ff4d6d;
      color: white;
    }

    .yes:hover {
      transform: scale(1.1);
    }

    .no {
      background: #eee;
    }

    .hidden-message {
      display: none;
      font-size: 1.4rem;
      margin-top: 20px;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .heart {
      position: absolute;
      color: #ff4d6d;
      font-size: 20px;
      animation: floatUp 4s linear infinite;
    }

    @keyframes floatUp {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-120vh); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Alina 💖</h1>
    <p>From random smiles to unforgettable moments,<br/>every day with you feels a little more magical ✨</p>

    <div class="question">Will you be my Valentine? 🌹</div>

    <div class="buttons" id="btnArea">
      <button class="yes" id="yesBtn" onclick="sayYes()">YES 💕</button>
      <button class="no" id="noBtn">No 🙃</button>
    </div>

    <div class="hidden-message" id="message">
      I knew you’d say yes 😌<br/>
      Happy Valentine’s Day, my love 💘
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const btnArea = document.getElementById('btnArea');
    const yesBtn = document.getElementById('yesBtn');

    // Ensure position for movement
    btnArea.style.position = 'relative';
    noBtn.style.position = 'absolute';

    function placeNoInitial() {
      const area = btnArea.getBoundingClientRect();
      const x = Math.max(8, area.width - noBtn.offsetWidth - 8);
      const y = Math.max(8, (area.height - noBtn.offsetHeight) / 2);
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    }

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    function dodgeFrom(clientX, clientY) {
      const area = btnArea.getBoundingClientRect();
      const btn = noBtn.getBoundingClientRect();

      const fx = clientX - area.left;
      const fy = clientY - area.top;

      const bx = (btn.left - area.left) + btn.width / 2;
      const by = (btn.top - area.top) + btn.height / 2;

      const dx = bx - fx;
      const dy = by - fy;
      const dist = Math.hypot(dx, dy);

      const dangerRadius = 90;

      if (dist < dangerRadius) {
        const push = (dangerRadius - dist) * 2.2;
        const angle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.5;

        const nx = bx + Math.cos(angle) * push;
        const ny = by + Math.sin(angle) * push;

        const left = nx - noBtn.offsetWidth / 2;
        const top  = ny - noBtn.offsetHeight / 2;

        const maxLeft = area.width - noBtn.offsetWidth - 4;
        const maxTop  = area.height - noBtn.offsetHeight - 4;

        noBtn.style.left = clamp(left, 4, maxLeft) + 'px';
        noBtn.style.top  = clamp(top, 4, maxTop) + 'px';

        // Make YES button grow slightly
        yesBtn.style.transform = `scale(${clamp(1 + (dangerRadius - dist)/260, 1, 1.12)})`;
      }
    }

    // Mobile finger proximity
    btnArea.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      dodgeFrom(t.clientX, t.clientY);
    }, { passive: true });

    // Pointer proximity for desktop/mobile
    btnArea.addEventListener('pointermove', (e) => {
      dodgeFrom(e.clientX, e.clientY);
    });

    // Escape if clicked
    noBtn.addEventListener('click', (e) => {
      e.preventDefault();
      const area = btnArea.getBoundingClientRect();
      const maxLeft = area.width - noBtn.offsetWidth - 4;
      const maxTop  = area.height - noBtn.offsetHeight - 4;
      noBtn.style.left = (4 + Math.random() * maxLeft) + 'px';
      noBtn.style.top  = (4 + Math.random() * maxTop) + 'px';
    });

    window.addEventListener('load', placeNoInitial);
    window.addEventListener('resize', placeNoInitial);

    function sayYes() {
      document.getElementById('message').style.display = 'block';
      launchHearts();
    }

    function launchHearts() {
      for (let i = 0; i < 30; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerHTML = '❤️';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.bottom = '-20px';
        heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 5000);
      }
    }
  </script>

</body>
</html>
